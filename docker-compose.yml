# Production: `docker compose up -d --build` runs all four services.
# Development: `make db` starts only Postgres; the app runs on the host.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  app:
    build: .
    restart: unless-stopped
    environment:
      # A small fixed pool: every Postgres connection costs the server memory.
      DATABASE_URL: postgres://crossover:${DB_PASSWORD:-crossover}@db:5432/crossover?pool_max_conns=${DB_POOL:-8}
      # Go collects garbage harder as it nears this, instead of growing. Set
      # it to about a quarter of the server's memory.
      GOMEMLIMIT: ${GOMEMLIMIT:-256MiB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      FETCH_VIA: ${FETCH_VIA:-}
      TZ: ${TZ:-America/New_York} # the nightly and weekly syncs run on this clock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started # cache health never gates app startup

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Disposable cache only. Keep memory bounded and evict unused entries.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Sized for one small server with an SSD: few connections, no JIT (its
    # compile time outweighs it on queries this size), and pg_stat_statements
    # to show where the time goes (see the README).
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - jit=off
      - -c
      - random_page_cost=1.1
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: crossover
      POSTGRES_USER: crossover
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crossover}
    ports: ["127.0.0.1:5433:5432"] # 5433 on the host; reachable only from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossover"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data:
