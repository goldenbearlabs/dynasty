version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          # The invite token is a credential: never serialized by accident.
          - column: franchises.invite_token
            go_struct_tag: 'json:"-"'
          # Stored JSON is passed through to API responses as JSON, not base64.
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
